@media (max-width:760px){.paper::after{display:none}}
.wrap{position:relative;z-index:2;max-width:560px;margin:0 auto;padding:22px 18px 48px}
.screen{animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6) rotate(-20deg);opacity:0}70%{transform:scale(1.08) rotate(6deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes grow{from{width:0}}
.msh :focus-visible{outline:2px solid #592255;outline-offset:3px}
.hrule{display:flex;align-items:center;gap:10px;color:#121214}
.hrule .ln{flex:1;height:2px;background:#121214}
.hrule .nm{font-size:22px;white-space:nowrap}
.hrule svg{width:24px;height:22px;flex:none}
.disp{font-family:'NT Panorama Naskh','Amiri',serif;font-weight:400;color:#592255;font-size:clamp(46px,13vw,74px);line-height:1.18;margin:0;text-align:center}
.verse{font-family:'NT Panorama Naskh','Amiri',serif;font-size:26px;line-height:1.75;color:#592255;text-align:center;margin:0}
.arch{position:relative;width:200px;height:236px;margin:26px auto 30px;background:#EFE0B6;border:6px solid #BD9FFF;border-radius:100px 100px 0 0;box-shadow:6px 6px 0 #121214;display:flex;align-items:center;justify-content:center;padding:20px}
.arch img{max-width:100%;max-height:100%;display:block}
.burst{position:absolute;pointer-events:none}
.burst path{fill:#BD9FFF}
.arch .burst{width:84px;height:84px;top:-30px;left:-40px;animation:pop .7s .2s ease both}
.band{display:flex;justify-content:space-around;align-items:center;background:#E5AF2F;padding:10px 6px;margin:26px -18px}
.band svg{width:30px;height:28px}
.band path{fill:#EFE0B6;stroke:#121214;stroke-width:1.4}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:22px 0}
.fact{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:22px;line-height:1.3}
.mk{flex:none;width:30px;height:30px;background:#EFE0B6;border:3px solid #BD9FFF;display:flex;align-items:center;justify-content:center}
.mk svg{width:16px;height:16px}
.mk path{fill:#CE3636}
.field{display:flex;flex-direction:column;gap:6px;margin:6px 0 22px}
.field label{font-size:24px;color:#592255}
.field small{font-size:20px;color:#121214}
.inp{font-family:'Arabic Typesetting','Amiri',serif;font-size:26px;padding:8px 14px;background:#EFE0B6;border:2px solid #121214;box-shadow:4px 4px 0 #121214;border-radius:0;color:#121214;width:100%}
.btn{font-family:'NT Panorama Naskh','Amiri',serif;font-weight:400;font-size:27px;line-height:1.2;padding:10px 26px 14px;min-height:58px;border:2px solid #121214;border-radius:0;background:#CE3636;color:#EFE0B6;box-shadow:5px 5px 0 #121214;cursor:pointer;transition:transform .1s ease,box-shadow .1s ease;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.btn:hover{transform:translate(-1px,-1px);box-shadow:6px 6px 0 #121214;color:#EFE0B6}
.btn:active{transform:translate(4px,4px);box-shadow:1px 1px 0 #121214}
.btn.velvet{background:#592255}
.btn.gold{background:#E5AF2F;color:#121214}
.btn.gold:hover{color:#121214}
.btn.ghost{background:#EFE0B6;color:#592255}
.btn.ghost:hover{color:#592255}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn.block{width:100%}
.btn.sm{font-size:22px;min-height:48px;padding:6px 16px 10px}
.lnk{font-family:'Arabic Typesetting','Amiri',serif;font-size:22px;color:#592255;background:none;border:0;padding:8px 4px;cursor:pointer;text-decoration:underline;text-underline-offset:5px;min-height:44px}
.center{text-align:center}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}
.count{font-family:'NT Panorama Naskh','Amiri',serif;font-size:24px;color:#592255}
.prog{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;margin:10px 0 34px}
.prog span{height:12px;border:2px solid #592255;background:#EFE0B6;transition:background .3s}
.prog span.done{background:#CE3636}
.prog span.now{background:#E5AF2F}
.qcard{position:relative;background:#CE3636;color:#EFE0B6;padding:26px 20px 24px;box-shadow:6px 6px 0 #121214;animation:rise .4s ease both}
.qnum{position:absolute;top:-30px;left:14px;font-family:'NT Panorama Naskh','Amiri',serif;font-size:52px;line-height:1;color:#E5AF2F;text-shadow:3px 4px 0 #000}
.qtag{font-size:24px;margin:0 0 4px;color:#EFE0B6}
.qtext{font-family:'NT Panorama Naskh','Amiri',serif;font-weight:400;font-size:28px;line-height:1.55;margin:0}
.opts{display:grid;gap:12px;margin-top:22px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:right;width:100%;background:#EFE0B6;border:4px solid #BD9FFF;border-radius:0;padding:12px 14px;font-family:'Arabic Typesetting','Amiri',serif;font-size:25px;line-height:1.45;color:#121214;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease,background .15s ease}
.opt:hover{border-color:#592255}
.opt .mk{margin-top:3px}
.opt.sel{background:#592255;color:#EFE0B6;border-color:#592255;box-shadow:5px 5px 0 #121214;transform:translate(-2px,-2px)}
.opt.sel .mk{border-color:#E5AF2F}
.nav{display:flex;gap:12px;margin-top:26px;align-items:stretch}
.nav .btn.next{flex:1}
.hint{font-size:21px;text-align:center;margin-top:12px;color:#121214}
.hero{position:relative;padding:34px 20px 28px;text-align:center;box-shadow:6px 6px 0 #121214;animation:rise .5s ease both;margin-top:18px}
.hero .burst{width:96px;height:96px;top:-34px;left:-26px;animation:pop .8s .3s ease both}
.hero .kick{font-size:24px;margin:0}
.hero .greet{font-family:'NT Panorama Naskh','Amiri',serif;font-weight:400;font-size:clamp(40px,11vw,58px);line-height:1.25;margin:6px 0 10px}
.hero .rname{font-family:'NT Panorama Naskh','Amiri',serif;font-size:26px;margin:0;display:inline-block;padding:2px 16px 6px}
.disc{width:88px;height:88px;border-radius:9999px;background:#EFE0B6;border:3px solid #121214;margin:0 auto 12px;display:flex;align-items:center;justify-content:center}
.disc svg{width:50px;height:50px}
.disc path{fill:none;stroke-width:3.2;stroke-linecap:square;stroke-linejoin:miter}
.desc{font-size:27px;line-height:1.7;margin:22px 0 0}
.stitle{font-family:'NT Panorama Naskh','Amiri',serif;font-weight:400;font-size:30px;line-height:1.3;color:#592255;margin:30px 0 12px}
.notes{display:grid;gap:12px}
.note{display:flex;gap:12px;align-items:center;border:4px solid #BD9FFF;background:#EFE0B6;padding:10px 14px;font-size:26px;line-height:1.4}
.task{background:#E5AF2F;padding:18px 18px 20px;box-shadow:6px 6px 0 #121214;font-size:26px;line-height:1.7}
.task .stitle{margin:0 0 6px}
.task p{margin:0}
.second{display:flex;gap:14px;align-items:center;border:6px solid #BD9FFF;background:#EFE0B6;padding:14px}
.sq{flex:none;width:58px;height:58px;display:flex;align-items:center;justify-content:center;border:2px solid #121214}
.sq svg{width:34px;height:34px}
.sq path{fill:none;stroke-width:3.4}
.second .t1{font-size:21px;margin:0}
.second .t2{font-family:'NT Panorama Naskh','Amiri',serif;font-size:26px;color:#592255;margin:0;line-height:1.3}
.tie{margin-top:12px;border:2px dashed #592255;padding:10px 14px;font-size:24px;line-height:1.55;color:#592255}
.spec{display:grid;gap:8px}
.srow{display:grid;grid-template-columns:minmax(0,46%) minmax(0,1fr);gap:10px;align-items:center;font-size:22px;line-height:1.3}
.track{height:18px;border:2px solid #121214;background:#EFE0B6}
.fill{height:100%;animation:grow 1s ease both}
.disclaim{display:flex;gap:10px;align-items:flex-start;font-size:23px;line-height:1.55;margin-top:24px}
.actions{display:grid;gap:14px;margin-top:22px}
.rtext{width:100%;min-height:150px;font-family:'Arabic Typesetting','Amiri',serif;font-size:22px;line-height:1.5;background:#EFE0B6;border:2px dashed #592255;padding:10px 12px;color:#121214;resize:vertical;border-radius:0}
.ok{font-size:23px;color:#592255;text-align:center;margin:0}
.wordmark{display:block;width:150px;margin:34px auto 0}
.admin-intro{font-size:24px;line-height:1.6;margin:8px 0 0}
.honest{display:flex;gap:10px;align-items:flex-start;background:#592255;color:#EFE0B6;padding:14px 16px;font-size:24px;line-height:1.55;margin-top:16px}
.honest .mk{background:#592255;border-color:#E5AF2F}
.honest .mk path{fill:#E5AF2F}
.steps{margin:14px 0 0;padding:0 22px 0 0;font-size:24px;line-height:1.7}
.paste{width:100%;min-height:170px;font-family:'Arabic Typesetting','Amiri',serif;font-size:22px;line-height:1.5;background:#EFE0B6;border:2px solid #121214;box-shadow:4px 4px 0 #121214;padding:10px 12px;color:#121214;border-radius:0}
.chk{display:flex;gap:10px;align-items:center;font-size:24px;margin:14px 0 0;min-height:44px}
.chk input{width:22px;height:22px;accent-color:#592255}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{border:4px solid #BD9FFF;background:#EFE0B6;padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px}
.tile .n{font-family:'NT Panorama Naskh','Amiri',serif;font-size:42px;line-height:1;color:#592255}
.tile .l{font-size:22px;line-height:1.3}
.tile .track{height:12px}
.team{border:2px solid #121214;background:#EFE0B6;margin-bottom:14px}
.team .th{display:flex;justify-content:space-between;align-items:center;padding:8px 14px 10px;font-family:'NT Panorama Naskh','Amiri',serif;font-size:24px}
.team .tb{padding:10px 12px 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid #592255;padding:0 12px 4px;font-size:23px;background:#EFE0B6}
.chip.alt{border-style:dashed;color:#592255}
.sub{font-size:21px;margin:10px 0 6px;color:#592255}
.empty{font-size:22px;color:#121214;margin:0}
.tblbox{overflow-x:auto;border:2px solid #121214;background:#EFE0B6}
.tbl{width:100%;border-collapse:collapse;font-size:22px;min-width:420px}
.tbl th{background:#592255;color:#EFE0B6;font-weight:400;text-align:right;padding:8px 10px}
.tbl td{padding:8px 10px;border-top:1px solid #121214}
.row2{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}
.row2 .btn{flex:1 1 200px}
</style>
</head>

    '<div class="band" aria-hidden="true">' + hearts + '</div>' +
    '<p class="verse">لِكُلِّ ضَوءٍ لَونُهُ<br>ولِكُلِّ فَتاةٍ دَورُها<br>فِي حَملَةِ البِـــرّ</p>' +
    '<div class="facts">' +
      '<div class="fact">' + mk(MSH_MARKS[0]) + '<span>١٢ موقفًا</span></div>' +
      '<div class="fact">' + mk(MSH_MARKS[2]) + '<span>قرابة ٣ دقائق</span></div>' +
      '<div class="fact">' + mk(MSH_MARKS[1]) + '<span>لا إجابة خاطئة</span></div>' +
    '</div>' +
    '<div class="field"><label for="msh-name">اسمكِ (اختياري)</label>' +
    '<input id="msh-name" class="inp" type="text" maxlength="30" autocomplete="off" placeholder="اكتبي اسمكِ الأول" value="' + esc(S.name) + '" data-input="name">' +
    '<small>يظهر في نتيجتكِ فقط حتى تعرف المنظِّمة لمن هي.</small></div>' +
    '<button class="btn block" type="button" data-act="start">اكتشفي دورك</button>' +
    '<p class="center" style="margin:26px 0 0"><button class="lnk" type="button" data-act="admin">لوحة منظِّمة الورشة</button></p>' +
  '</div>';
}

function vQuiz() {
  var q = MSH_Q[S.qi], picked = S.answers[S.qi], last = S.qi === MSH_Q.length - 1;
  var prog = MSH_Q.map(function (_, i) { return '<span class="' + (i < S.qi ? 'done' : i === S.qi ? 'now' : '') + '"></span>'; }).join('');
  var opts = q.o.map(function (o, i) {
    var sel = picked === i;
    return '<button type="button" class="opt' + (sel ? ' sel' : '') + '" aria-pressed="' + sel + '" data-act="pick" data-i="' + i + '">' + mk(MSH_MARKS[i]) + '<span>' + esc(o.t) + '</span></button>';
  }).join('');
  return '<div class="screen">' +
    '<div class="topbar"><span class="count">المَوقِف ' + mshAr(S.qi + 1) + ' من ١٢</span><img src="' + IMG_WORD + '" alt="موشور" style="height:34px;width:auto"></div>' +
    '<div class="prog" aria-hidden="true">' + prog + '</div>' +
    '<div class="qcard"><span class="qnum" aria-hidden="true">' + mshAr(S.qi + 1) + '</span><p class="qtag">تخيّلي المَوقف :</p><h2 class="qtext">' + esc(q.text) + '</h2></div>' +
    '<div class="opts">' + opts + '</div>' +
    '<div class="nav"><button class="btn ghost sm" type="button" data-act="back">السابق</button>' +
    '<button class="btn velvet next" type="button" data-act="next"' + (picked == null ? ' disabled' : '') + '>' + (last ? 'اكشفي نتيجتي' : 'التالي') + '</button></div>' +
    '<p class="hint">اختاري أقرب تصرّف لكِ، لا الأجمل على الورق.</p>' +
  '</div>';
}

function vResult() {
  var res = S.result, r = MSH_ROLES[res.first], r2 = MSH_ROLES[res.second], n = cleanName();
  var top = res.scores[res.first] || 1, text = resultText(res);
  var bars = res.ranked.map(function (k) {
    var pct = Math.max(4, Math.round(100 * res.scores[k] / top));
    return '<div class="srow"><span>' + esc(MSH_ROLES[k].name) + '</span><span class="track"><span class="fill" style="display:block;width:' + pct + '%;background:' + MSH_ROLES[k].fill + '"></span></span></div>';
  }).join('');
  var tie = '';
  if (res.tie) tie = 'تساوت نتيجتكِ بين ' + res.tiedTop.map(function (k) { return '«' + MSH_ROLES[k].name + '»'; }).join(' و') + '. هذا يعني أنكِ تناسبين أكثر من مهمة، فاختاري منها ما ترغبين في تجربته.';
  else if (res.close) tie = 'الفرق بين دوركِ الأول والثاني بسيط، فكلاهما مناسب لكِ؛ اختاري ما تحبين تجربته.';
  return '<div class="screen">' +
    '<div class="hero" style="background:' + r.bg + ';color:' + r.text + ';border:' + r.border + '">' + burst() +
      '<div class="disc" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="' + r.icon + '" stroke="' + r.iconInk + '"/></svg></div>' +
      '<p class="kick">' + (n ? 'يا ' + esc(n) + '،' : 'نتيجتكِ :') + '</p>' +
      '<h1 class="greet" style="color:' + r.title + ';text-shadow:' + r.shadow + '">' + r.greet + '</h1>' +
      '<p class="rname" style="background:' + r.tagBg + ';color:' + r.tagInk + '">' + r.name + '</p>' +
    '</div>' +
    '<p class="desc">' + r.desc + '</p>' +
    '<h2 class="stitle">أبرَزُ نِقاطِ قُوَّتِكِ :</h2>' +
    '<div class="notes">' + res.strengths.map(function (s, i) { return '<div class="note">' + mk(MSH_MARKS[i === 0 ? 3 : 1]) + '<span>' + esc(s) + '</span></div>'; }).join('') + '</div>' +
    '<div style="margin-top:30px" class="task"><h2 class="stitle">مَهَمَّتُكِ فِي حَملَةِ البِرّ :</h2><p>' + r.task + '</p></div>' +
    '<h2 class="stitle">الدَّورُ الأقرَبُ لَكِ بَعدَه :</h2>' +
    '<div class="second"><span class="sq" style="background:' + r2.bg + '" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="' + r2.icon + '" stroke="' + r2.title + '"/></svg></span>' +
      '<div><p class="t2">' + r2.name + '</p><p class="t1">' + r2.short + '</p></div></div>' +
    (tie ? '<p class="tie">' + tie + '</p>' : '') +
    '<h2 class="stitle">طَيفُكِ فِي الحَملَة :</h2><div class="spec">' + bars + '</div>' +
    '<div class="disclaim">' + mk(MSH_MARKS[3]) + '<span>هذه توصية أولية تساعد في توزيع العمل، لا حُكمًا على شخصيتكِ أو قدراتكِ. إن رغبتِ في تجربة دور آخر فأخبري المنظِّمة.</span></div>' +
    '<div class="actions">' +
      '<button class="btn block" type="button" data-act="copyResult">نسخ نتيجتي</button>' +
      '<p class="ok" id="copy-msg" aria-live="polite"></p>' +
      '<a class="btn gold block" href="https://wa.me/?text=' + encodeURIComponent(text) + '" target="_blank" rel="noopener">إرسال عبر واتساب</a>' +
      '<label for="msh-result-text" class="sub">نص نتيجتكِ :</label>' +
      '<textarea id="msh-result-text" class="rtext" readonly>' + esc(text) + '</textarea>' +
      '<button class="btn ghost block" type="button" data-act="restart">أعيدي الاختبار</button>' +
    '</div>' +
    '<img class="wordmark" src="' + IMG_WORD + '" alt="موشور">' +
  '</div>';
}

function vAdminData() {
  var rows = allRows(), counts = {};
  MSH_ORDER.forEach(function (k) { counts[k] = 0; });
  rows.forEach(function (x) { counts[x.r1]++; });
  var maxC = Math.max.apply(null, MSH_ORDER.map(function (k) { return counts[k]; }).concat([1]));
  var tiles = MSH_ORDER.map(function (k) {
    return '<div class="tile"><span class="n">' + mshAr(counts[k]) + '</span><span class="l">' + MSH_ROLES[k].name + '</span><span class="track"><span class="fill" style="display:block;width:' + Math.round(100 * counts[k] / maxC) + '%;background:' + MSH_ROLES[k].fill + '"></span></span></div>';
  }).join('');
  var teams = MSH_ORDER.map(function (k) {
    var R = MSH_ROLES[k], light = R.bg === '#EFE0B6';
    var main = rows.filter(function (x) { return x.r1 === k; }).map(function (x) { return x.name; });
    var alt = rows.filter(function (x) { return x.r2 === k; }).map(function (x) { return x.name; });
    return '<div class="team"><div class="th" style="background:' + (light ? '#592255' : R.bg) + ';color:' + (light ? '#EFE0B6' : R.text) + '"><span>' + R.name + '</span><span>' + mshAr(main.length) + '</span></div><div class="tb">' +
      (main.length ? '<div class="chips">' + main.map(function (m) { return '<span class="chip">' + esc(m) + '</span>'; }).join('') + '</div>' : '<p class="empty">لا أحد بعد في هذا الدور كخيار أول.</p>') +
      (alt.length ? '<p class="sub">يمكن أن يدعمن الفريق (دور ثانٍ) :</p><div class="chips">' + alt.map(function (m) { return '<span class="chip alt">' + esc(m) + '</span>'; }).join('') + '</div>' : '') +
      '</div></div>';
  }).join('');
  var trs = rows.map(function (x, i) { return '<tr><td>' + mshAr(i + 1) + '</td><td>' + esc(x.name) + '</td><td>' + MSH_ROLES[x.r1].name + '</td><td>' + MSH_ROLES[x.r2].name + '</td></tr>'; }).join('');
  var tsv = 'الاسم\tالدور الأول\tالدور الثاني\n' + rows.map(function (x) { return x.name + '\t' + MSH_ROLES[x.r1].name + '\t' + MSH_ROLES[x.r2].name; }).join('\n');
  return { rows: rows, html:
    '<h2 class="stitle">المشاركات حسب الدور (' + mshAr(rows.length) + ') :</h2><div class="tiles">' + tiles + '</div>' +
    '<h2 class="stitle">الفِرَقُ المُقتَرَحَة :</h2>' + teams +
    '<h2 class="stitle">جَدوَلُ النَّتائِج :</h2><div class="tblbox"><table class="tbl"><thead><tr><th>#</th><th>الاسم</th><th>الدور الأول</th><th>الدور الثاني</th></tr></thead><tbody>' + trs + '</tbody></table></div>' +
    (rows.length ? '' : '<p class="empty" style="margin-top:10px">لم تُضف أي نتيجة بعد.</p>'), tsv: tsv };
}

function vAdmin() {
  var d = vAdminData();
  return '<div class="screen">' +
    '<h1 class="disp" style="font-size:clamp(38px,10vw,56px);margin-top:22px">لَوحَةُ المُنَظِّمَـــة</h1>' +
    '<p class="admin-intro center">اجمعي نتائج المشاركات ووزّعيهن على فرق حملة البر.</p>' +
    '<div class="honest">' + mk(MSH_MARKS[0]) + '<span>اللعبة لا تتزامن بين الأجهزة. اللوحة تجمع فقط ما تلصقينه هنا، ونتائج من لعبن على هذا الجهاز نفسه.</span></div>' +
    '<ol class="steps"><li>تضغط كل فتاة «نسخ نتيجتي» أو «إرسال عبر واتساب» وترسلها لكِ.</li><li>انسخي الرسائل كلها مرة واحدة والصقيها في المربع.</li><li>تظهر الفرق والجدول تلقائيًا، وانسخي الجدول إلى Excel.</li></ol>' +
    '<h2 class="stitle">الصقي النتائج هنا :</h2>' +
    '<label for="msh-paste" class="sub">رسائل المشاركات (يمكن لصق رسائل كثيرة معًا)</label>' +
    '<textarea id="msh-paste" class="paste" placeholder="الصقي هنا رسائل النتائج كما وصلتكِ…" data-input="paste">' + esc(S.pasted) + '</textarea>' +
    '<label class="chk"><input type="checkbox" data-input="device"' + (S.includeDevice ? ' checked' : '') + '> <span>إضافة نتائج هذا الجهاز (' + mshAr(S.log.length) + ')</span></label>' +
    '<div id="admin-data">' + d.html + '</div>' +
    '<div class="row2"><button class="btn velvet" type="button" data-act="copyTable">نسخ الجدول</button><button class="btn ghost" type="button" data-act="clearPaste">مسح الملصق</button></div>' +
    '<p class="ok" id="table-msg" style="margin-top:10px" aria-live="polite"></p>' +
    '<label for="msh-table-text" class="sub">الجدول نصًّا (مفصول بعلامات جدولة) :</label>' +
    '<textarea id="msh-table-text" class="rtext" readonly>' + esc(d.tsv) + '</textarea>' +
    '<div class="row2"><button class="btn ghost sm" type="button" data-act="clearDevice">' + (S.confirmClear ? 'اضغطي مجددًا لتأكيد المسح' : 'مسح نتائج هذا الجهاز') + '</button><button class="btn sm" type="button" data-act="home">العودة للعبة</button></div>' +
  '</div>';
}

function render() {
  var v = S.screen === 'quiz' ? vQuiz() : S.screen === 'result' ? vResult() : S.screen === 'admin' ? vAdmin() : vIntro();
  document.getElementById('app').innerHTML = v;
}

function copyText(text, elId, msgId, okMsg, failMsg) {
  var msg = document.getElementById(msgId);
  var ok = function () { if (msg) { msg.textContent = okMsg; setTimeout(function () { if (msg) msg.textContent = ''; }, 3000); } };
  var fallback = function () {
    try { var el = document.getElementById(elId); el.focus(); el.select(); el.setSelectionRange(0, 999999); if (document.execCommand('copy')) { ok(); return; } } catch (e) {}
    if (msg) msg.textContent = failMsg;
  };
  try { if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(text).then(ok, fallback); return; } } catch (e) {}
  fallback();
}

document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  var a = b.getAttribute('data-act');
  if (a === 'start') { S.screen = 'quiz'; S.qi = 0; S.answers = MSH_Q.map(function () { return null; }); render(); toTop(); }
  else if (a === 'admin') { S.screen = 'admin'; S.log = readLog(); render(); toTop(); }
  else if (a === 'home') { S.screen = 'intro'; render(); toTop(); }
  else if (a === 'pick') { S.answers[S.qi] = +b.getAttribute('data-i'); render(); }
  else if (a === 'back') { if (S.qi > 0) S.qi--; else S.screen = 'intro'; render(); }
  else if (a === 'next') {
    if (S.answers[S.qi] == null) return;
    if (S.qi < MSH_Q.length - 1) { S.qi++; render(); toTop(); }
    else {
      S.result = mshScore(S.answers);
      var log = readLog(); log.push({ name: cleanName(), r1: S.result.first, r2: S.result.second, at: Date.now() }); writeLog(log); S.log = log;
      S.screen = 'result'; render(); toTop();
    }
  }
  else if (a === 'restart') { S.screen = 'intro'; S.name = ''; S.qi = 0; S.answers = []; S.result = null; render(); toTop(); }
  else if (a === 'copyResult') copyText(resultText(S.result), 'msh-result-text', 'copy-msg', 'نُسخت النتيجة، أرسليها لمنظِّمة الورشة.', 'لم يسمح الجهاز بالنسخ التلقائي؛ اضغطي مطوّلًا على النص بالأسفل وانسخيه.');
  else if (a === 'copyTable') copyText(vAdminData().tsv, 'msh-table-text', 'table-msg', 'نُسخ الجدول، الصقيه في Excel أو Google Sheets.', 'لم يسمح الجهاز بالنسخ التلقائي؛ انسخي النص من المربع بالأسفل.');
  else if (a === 'clearPaste') { S.pasted = ''; render(); }
  else if (a === 'clearDevice') {
    if (!S.confirmClear) { S.confirmClear = true; render(); setTimeout(function () { if (S.confirmClear) { S.confirmClear = false; if (S.screen === 'admin') render(); } }, 4000); return; }
    writeLog([]); S.log = []; S.confirmClear = false; render();
  }
});

function refreshAdmin() {
  var d = vAdminData();
  document.getElementById('admin-data').innerHTML = d.html;
  document.getElementById('msh-table-text').value = d.tsv;
}
document.addEventListener('input', function (e) {
  var k = e.target.getAttribute('data-input');
  if (k === 'name') S.name = e.target.value;
  else if (k === 'paste') { S.pasted = e.target.value; refreshAdmin(); }
});
document.addEventListener('change', function (e) {
  if (e.target.getAttribute('data-input') === 'device') { S.includeDevice = e.target.checked; refreshAdmin(); }
});

S.log = readLog();
render();

</script>
</body>
</html>
